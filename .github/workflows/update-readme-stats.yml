name: Update GitHub Readme Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # update daily

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check stats token
        env:
          README_STATS_TOKEN: ${{ secrets.README_STATS_TOKEN }}
        run: |
          if [ -z "$README_STATS_TOKEN" ]; then
            echo "::error::Add the README_STATS_TOKEN repository secret with a user PAT for GitHub Readme Stats. The repository-scoped GITHUB_TOKEN cannot reliably read user-wide contribution statistics."
            exit 1
          fi

      # Keep the original renderer and options; use a user token for user-wide stats.
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=material-palenight&rank_icon=github&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      # Top languages card
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=320&theme=material-palenight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in (Path("profile/stats.svg"), Path("profile/top-langs.svg")):
              root = ET.fromstring(path.read_text(encoding="utf-8"))
              text = " ".join(root.itertext()).lower()
              assert root.tag == "{http://www.w3.org/2000/svg}svg", path
              assert not any(error in text for error in (
                  "something went wrong", "resource not accessible", "rate limit",
              )), f"Error card generated: {path}"
          PY

      # Commit generated SVGs only after successful validation.
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update GitHub Readme Stats"
          git push
